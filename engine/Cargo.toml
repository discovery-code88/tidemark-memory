[package]
name = "tidemark-engine"
version = "0.1.0"
edition = "2021"
description = "Tidemark memory engine: ingestion, retrieval, scoring, dates, answering and profiles"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "process", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1"
url = "2"
schemars = "0.8"
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
